# Замените ваш-домен.ru на реальный домен перед включением.
#
# Установка:
#   sudo cp deploy/nginx-olimp.conf /etc/nginx/sites-available/olimp
#   sudo ln -sf /etc/nginx/sites-available/olimp /etc/nginx/sites-enabled/olimp
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d ваш-домен.ru -d www.ваш-домен.ru
#
# Certbot сам добавит SSL и редирект HTTP -> HTTPS.

server {
    listen 80;
    listen [::]:80;
    server_name ваш-домен.ru www.ваш-домен.ru;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
